[package]
name = "tradoor-venues"
description = "Exchange URLs and response parsers for Binance and Bybit. No networking: callers fetch, this crate only knows the shapes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tradoor-core.workspace = true
tradoor-codec.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
