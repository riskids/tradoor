[package]
name = "tradoor-store"
description = "Partition files on disk and their index in Postgres."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tradoor-core.workspace = true
tradoor-codec = { workspace = true, features = ["gzip", "manifest"] }
tradoor-venues.workspace = true
refinery = { version = "0.9.2", features = ["tokio-postgres"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tracing = "0.1.44"
