# tradoor behind the host's nginx: the app from /var/www/tradoor/web, the API and
# the candle partitions from the container on 127.0.0.1:8080.
#
#   cp tradoor.conf /etc/nginx/sites-available/tradoor
#   cp security-headers.conf /etc/nginx/snippets/tradoor-security-headers.conf
#   cp http.conf /etc/nginx/conf.d/tradoor.conf    # Cloudflare's visitor address, request limits
#   ln -s /etc/nginx/sites-available/tradoor /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d tradoor.example.com
server {
    listen 80;
    listen [::]:80;
    server_name tradoor.example.com;
    server_tokens off;
    include snippets/tradoor-security-headers.conf;

    root /var/www/tradoor/web;
    index index.html;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # A saved layout is at most half a megabyte.
    client_max_body_size 1m;

    # Hashed build output never changes under its name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/tradoor-security-headers.conf;
        try_files $uri =404;
    }

    # The exchange stream relay: a WebSocket that stays open for hours.
    location /api/relay/ws {
        limit_conn tradoor_conn 32;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location /api/ {
        limit_req zone=tradoor_api burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Candle partitions and manifests; the server sets their cache headers.
    location /data/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location / {
        add_header Cache-Control "no-cache";
        include snippets/tradoor-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
