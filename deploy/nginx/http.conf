# tradoor's http-level nginx settings, in /etc/nginx/conf.d/tradoor.conf.
#
# The site sits behind Cloudflare, whose CF-Connecting-IP header names the
# visitor. It is used as it comes, not through nginx's real_ip module: with
# real_ip, $remote_addr becomes the visitor, and a server that admits only
# Cloudflare's addresses (allow …; deny all;) would then refuse everyone. It
# can be trusted because that admission rule keeps anyone but Cloudflare from
# reaching nginx at all — without such a rule, anyone could name themselves.
#
# Requests per visitor, before they reach the server — which limits them again,
# per kind (bins/server/src/limits.rs). A request without the header (not
# through Cloudflare) has an empty key and is not counted here.
limit_req_zone $http_cf_connecting_ip zone=tradoor_api:10m rate=20r/s;
limit_conn_zone $http_cf_connecting_ip zone=tradoor_conn:10m;
